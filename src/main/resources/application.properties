
spring.config.import=optional:file:.env[.properties]

spring.application.name=alumini


# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/alumni_searcher}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}


# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=${PORT:8080}

# PhantomBuster Configuration
phantombuster.api.key=${PHANTOMBUSTER_API_KEY}
phantombuster.agent.id=${PHANTOMBUSTER_AGENT_ID}
phantombuster.api.url=https://api.phantombuster.com/api/v2

# Bridgly Configuration
bridgly.api.key=${BRIDGLY_API_KEY}
